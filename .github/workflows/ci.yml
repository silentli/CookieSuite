name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cookiesuite_test
      DB_USERNAME: postgres
      DB_PASSWORD: testing

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cookiesuite_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cookiesuite_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run tests
        run: php artisan test
